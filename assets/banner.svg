<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Mohamad Halakoei — Senior Backend Developer</title>
  <desc id="d">Backend, data and AI systems</desc>
  <style>
    /* Layout: identity on the left, a quiet service graph on the right */
    :root { --bg:#F7F8FB; --panel:#FFFFFF; --ink:#0F172A; --muted:#5B6476; --line:#D7DCE6; --grid:#E7EAF1; --accent:#2F5BD3; --warm:#D9922E; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0D1117; --panel:#151B24; --ink:#E6EAF2; --muted:#8B95A7; --line:#2A3342; --grid:#1A212C; --accent:#6E95FF; --warm:#E8A94B; }
    }
    .bg { fill: var(--bg); stroke: var(--line); }
    .dot { fill: var(--grid); }
    .eyebrow { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--accent); letter-spacing: .08em; }
    .name { font: 700 58px -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); letter-spacing: -.02em; }
    .role { font: 500 24px -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--muted); }
    .stack { font: 400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--muted); }
    .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .node text { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--ink); }
    .node.hot rect { stroke: var(--accent); stroke-width: 1.6; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
    .pulse { fill: var(--accent); }
    .pulse.warm { fill: var(--warm); }
    .bar { fill: var(--accent); }
    @media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" class="dot"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="318" rx="22"/></clipPath>
  </defs>

  <rect class="bg" x="1" y="1" width="1198" height="318" rx="22"/>
  <rect x="640" y="1" width="559" height="318" fill="url(#dots)" clip-path="url(#frame)"/>

  <!-- identity -->
  <rect class="bar" x="64" y="78" width="28" height="4" rx="2"/>
  <text class="eyebrow" x="104" y="85">BACKEND · DATA · AI</text>
  <text class="name" x="62" y="160">Mohamad Halakoei</text>
  <text class="role" x="64" y="202">Senior Backend Developer</text>
  <text class="stack" x="64" y="250">python · django · fastapi · postgresql · redis · llm agents</text>

  <!-- service graph -->
  <path id="e1" class="edge" d="M790 100 H870"/>
  <path id="e2" class="edge" d="M960 100 C1000 100 1000 70 1040 70"/>
  <path id="e3" class="edge" d="M960 100 C1000 100 1000 160 1040 160"/>
  <path id="e4" class="edge" d="M915 120 V200"/>
  <path id="e5" class="edge" d="M960 220 H1040"/>
  <path id="e6" class="edge" d="M870 228 C835 228 835 266 810 266"/>

  <g class="node"><rect x="700" y="80" width="90" height="40" rx="10"/><text x="745" y="105" text-anchor="middle">client</text></g>
  <g class="node hot"><rect x="870" y="80" width="90" height="40" rx="10"/><text x="915" y="105" text-anchor="middle">api</text></g>
  <g class="node"><rect x="1040" y="50" width="104" height="40" rx="10"/><text x="1092" y="75" text-anchor="middle">postgres</text></g>
  <g class="node"><rect x="1040" y="140" width="104" height="40" rx="10"/><text x="1092" y="165" text-anchor="middle">redis</text></g>
  <g class="node"><rect x="870" y="200" width="90" height="40" rx="10"/><text x="915" y="225" text-anchor="middle">worker</text></g>
  <g class="node hot"><rect x="1040" y="200" width="104" height="40" rx="10"/><text x="1092" y="225" text-anchor="middle">llm agent</text></g>
  <g class="node"><rect x="700" y="246" width="110" height="40" rx="10"/><text x="755" y="271" text-anchor="middle">dashboard</text></g>

  <circle class="pulse" r="4"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
  <circle class="pulse" r="4"><animateMotion dur="3.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
  <circle class="pulse warm" r="4"><animateMotion dur="3.6s" begin="-1.4s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
  <circle class="pulse" r="4"><animateMotion dur="4s" begin="-0.4s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
</svg>
