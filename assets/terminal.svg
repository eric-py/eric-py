<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t">
  <title id="t">$ curl mohamadhalakoei.ir/whoami — Senior Backend Developer, focus: backend, data platforms, AI agents; open to freelance</title>
  <style>
    /* Layout: a single terminal window; command types in, then the JSON reply prints line by line */
    :root { --win:#FFFFFF; --bar:#F1F3F8; --line:#D7DCE6; --ink:#0F172A; --muted:#6B7385; --accent:#2F5BD3; --key:#7A3FC4; --str:#1F8A5B; --num:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --win:#11161E; --bar:#171E29; --line:#2A3342; --ink:#E6EAF2; --muted:#8B95A7; --accent:#6E95FF; --key:#C49BFF; --str:#5FD3A0; --num:#F2A65A; }
    }
    .win { fill: var(--win); stroke: var(--line); stroke-width: 1.2; }
    .bar { fill: var(--bar); }
    .sep { stroke: var(--line); stroke-width: 1; }
    .title { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--muted); }
    .mono { font: 400 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--ink); white-space: pre; }
    .prompt { fill: var(--accent); font-weight: 600; }
    .muted { fill: var(--muted); }
    .k { fill: var(--key); }
    .s { fill: var(--str); }
    .n { fill: var(--num); }

    /* typing: a mask rect grows across the command in character steps */
    .typer { animation: type 1.6s steps(30, end) .5s both; }
    @keyframes type { from { width: 0; } to { width: 312px; } }

    .cursor { fill: var(--accent); animation: blink 1s steps(1) infinite; }
    .cursor.c1 { animation: blink 1s steps(1) infinite, hide 0s 2.2s forwards; }
    .cursor.c2 { opacity: 0; animation: show 0s 4.6s forwards, blink 1s steps(1) 4.6s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hide { to { visibility: hidden; } }
    @keyframes show { to { opacity: 1; } }

    .ln { opacity: 0; animation: print .35s ease-out both; }
    .l1 { animation-delay: 2.3s; } .l2 { animation-delay: 2.6s; } .l3 { animation-delay: 2.9s; }
    .l4 { animation-delay: 3.2s; } .l5 { animation-delay: 3.5s; } .l6 { animation-delay: 3.8s; } .l7 { animation-delay: 4.1s; }
    @keyframes print { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .typer { animation: none; width: 312px; }
      .ln { animation: none; opacity: 1; }
      .cursor, .cursor.c1, .cursor.c2 { animation: none; }
      .cursor.c1 { visibility: hidden; } .cursor.c2 { opacity: 1; }
    }
  </style>
  <defs>
