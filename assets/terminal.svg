  <text class="mono ln l3" x="36" y="192">  <tspan class="k">"role"</tspan>: <tspan class="s">"Senior Backend Developer"</tspan>,</text>
  <text class="mono ln l4" x="36" y="220">  <tspan class="k">"focus"</tspan>: [<tspan class="s">"backend"</tspan>, <tspan class="s">"data platforms"</tspan>, <tspan class="s">"ai agents"</tspan>],</text>
  <text class="mono ln l5" x="36" y="248">  <tspan class="k">"stack"</tspan>: [<tspan class="s">"python"</tspan>, <tspan class="s">"django"</tspan>, <tspan class="s">"fastapi"</tspan>, <tspan class="s">"postgresql"</tspan>, <tspan class="s">"redis"</tspan>],</text>
  <text class="mono ln l6" x="36" y="276">  <tspan class="k">"status"</tspan>: <tspan class="s">"open to freelance"</tspan></text>
