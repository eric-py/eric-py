<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t">
  <title id="t">What I do: backend architecture, data platforms, AI and automation, delivery</title>
  <style>
    /* Layout: 2×2 grid of focus cards; cards rise in one after another, icons carry a small idle motion */
    :root { --panel:#FFFFFF; --ink:#0F172A; --muted:#5B6476; --line:#D7DCE6; --accent:#2F5BD3; --tint:#EEF2FC; }
    @media (prefers-color-scheme: dark) {
      :root { --panel:#151B24; --ink:#E6EAF2; --muted:#8B95A7; --line:#2A3342; --accent:#6E95FF; --tint:#1B2433; }
    }
    .card { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .chip { fill: var(--tint); }
    .ico { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fillacc { fill: var(--accent); }
    .h { font: 650 22px -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
    .p { font: 400 16px -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--muted); }
    .tag { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--accent); letter-spacing: .04em; }

    .cg { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    .c1 { animation-delay: .15s; } .c2 { animation-delay: .35s; } .c3 { animation-delay: .55s; } .c4 { animation-delay: .75s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* idle icon motion */
    .led { animation: led 2.4s ease-in-out infinite; }
    .led2 { animation-delay: 1.2s; }
    @keyframes led { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    .col { transform-box: fill-box; transform-origin: bottom; animation: col 2.8s ease-in-out infinite; }
    .col.b2 { animation-delay: .3s; } .col.b3 { animation-delay: .6s; } .col.b4 { animation-delay: .9s; }
    @keyframes col { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }

    .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.6s ease-out infinite; }
    @keyframes halo { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }

    .tick { stroke-dasharray: 1; stroke-dashoffset: 1; animation: tick 3.2s ease-in-out infinite; }
    @keyframes tick { 0%, 15% { stroke-dashoffset: 1; } 45%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .cg, .led, .col, .halo, .tick { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
      .halo { opacity: 0; }
    }
  </style>

  <!-- backend architecture -->
  <g class="cg c1">
    <rect class="card" x="1" y="1" width="590" height="170" rx="18"/>
    <rect class="chip" x="32" y="32" width="48" height="48" rx="12"/>
    <g class="ico"><rect x="44" y="44" width="24" height="9" rx="2"/><rect x="44" y="59" width="24" height="9" rx="2"/></g>
    <circle class="fillacc led" cx="49" cy="48.5" r="1.8"/><circle class="fillacc led led2" cx="49" cy="63.5" r="1.8"/>
    <text class="h" x="100" y="58">Backend architecture</text>
    <text class="tag" x="100" y="80">APIS · SERVICES · DATABASES</text>
    <text class="p" x="32" y="120">Service design, REST APIs, database modeling and</text>
    <text class="p" x="32" y="144">query optimization, caching and async processing.</text>
  </g>

  <!-- data platforms -->
  <g class="cg c2">
    <rect class="card" x="609" y="1" width="590" height="170" rx="18"/>
    <rect class="chip" x="640" y="32" width="48" height="48" rx="12"/>
    <g class="ico"><path class="col b1" d="M652 68V54"/><path class="col b2" d="M661 68V46"/><path class="col b3" d="M670 68V58"/><path class="col b4" d="M679 68V50"/></g>
    <text class="h" x="708" y="58">Data platforms</text>
    <text class="tag" x="708" y="80">PIPELINES · ANALYTICS · DASHBOARDS</text>
    <text class="p" x="640" y="120">Data pipelines, ETL and interactive analytics</text>
    <text class="p" x="640" y="144">dashboards that support real decisions.</text>
  </g>

  <!-- ai and automation -->
  <g class="cg c3">
    <rect class="card" x="1" y="189" width="590" height="170" rx="18"/>
    <rect class="chip" x="32" y="220" width="48" height="48" rx="12"/>
    <circle class="ico halo" cx="56" cy="244" r="6"/>
    <g class="ico"><path d="M56 232v4M56 252v4M44 244h4M64 244h4"/><circle cx="56" cy="244" r="6"/></g>
    <text class="h" x="100" y="246">AI &amp; automation</text>
    <text class="tag" x="100" y="268">LLM AGENTS · OCR · SCRAPING</text>
    <text class="p" x="32" y="308">LLM-powered agents, OCR and image processing,</text>
    <text class="p" x="32" y="332">web scraping and workflow automation.</text>
  </g>

  <!-- delivery -->
  <g class="cg c4">
    <rect class="card" x="609" y="189" width="590" height="170" rx="18"/>
    <rect class="chip" x="640" y="220" width="48" height="48" rx="12"/>
    <g class="ico"><path d="M652 238h10"/><path class="tick" pathLength="1" d="M652 250l8 6 16-18"/></g>
    <text class="h" x="708" y="246">Delivery</text>
    <text class="tag" x="708" y="268">DOCKER · CI/CD · TESTING</text>
    <text class="p" x="640" y="308">Containerized services, CI/CD pipelines, testing</text>
    <text class="p" x="640" y="332">and production-ready deployments.</text>
  </g>
</svg>
